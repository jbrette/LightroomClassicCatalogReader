[project]
name = "lr-reader"
version = "0.4.0"
description = "Extract and output image file data from Lightroom Classic databases"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Larry Pearson", email = "ThatLarryPearson@gmail.com" }]
keywords = [
    "Adobe Lightroom Classic", "Lightroom", "Catalog", "Database",
    ".lrcat", "SQLite3", "Image", "File", "Reader",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
"Source Code" = "https://github.com/thatlarrypearson/LightRoomClassicCatalogReader"
"Bug Tracker" = "https://github.com/thatlarrypearson/LightRoomClassicCatalogReader/issues"

[project.scripts]
lr-reader = "lr_reader:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["lr_reader.py"]

[tool.ruff]
line-length = 100
target-version = "py314"
required-version = "==0.16.3"
src = [".", "tests"]

[tool.ruff.lint]
# Every rule ruff ships; the ignores below are the minimum needed to resolve
# rule conflicts, not to relax checking.
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211 (no blank line before class docstring)
    "D213",   # conflicts with D212 (summary on the first docstring line)
    "COM812", # conflicts with `ruff format`
]

[tool.ruff.lint.per-file-ignores]
"lr_reader.py" = [
    "T201", # print() is the CLI's output channel
]
"tests/**" = [
    "S101",    # pytest is assert-based
    "PLR2004", # literal expected values are the point of a test
    "INP001",  # tests/ is a rootdir, not a package (conftest is imported by name)
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = false
suppress-dummy-args = false
suppress-none-returning = false

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.isort]
known-first-party = ["lr_reader", "conftest"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
files = ["lr_reader.py", "tests"]
mypy_path = "tests"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_expr = true
local_partial_types = true
strict_bytes = true
extra_checks = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "unused-awaitable",
    "unused-ignore",
    "explicit-override",
    "mutable-override",
    "unimported-reveal",
    "deprecated",
    "exhaustive-match",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=lr_reader",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
