schema: spec-driven

context: |
  Single-module Python 3.14 tool (lr_reader.py), standard library only, managed with uv.
  Reads Adobe Lightroom Classic catalogs (.lrcat SQLite) read-only; never writes to a catalog.
  Gates: ruff select=ALL, mypy strict with no Any, pytest with warnings as errors and 100% branch
  coverage, all run by pre-commit. Record dict keys and the CLI output format are public contracts.

